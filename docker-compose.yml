services:
  pr_assignment_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pr_assignment_service
    env_file:
      - ./.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "${PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - pr_assignment_network
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: pr_assignment_service_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'" ]
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      - pr_assignment_network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pr_assignment_migrate
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: host=postgres port=${POSTGRES_PORT} dbname=${POSTGRES_DB} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} sslmode=disable
    networks:
      - pr_assignment_network
    entrypoint: ["goose"]
    command: ["-dir", "./migrations", "up"]

volumes:
  pgdata:

networks:
  pr_assignment_network:
    driver: bridge
